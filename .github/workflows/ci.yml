name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Regression checks
        run: dotnet run --project tests/Beeslator.Regression -c Release

      - name: Build
        run: dotnet build src/Filetranslate.csproj -c Release

      - name: Build ARM64
        run: dotnet build src/Filetranslate.csproj -c Release -r win-arm64 --self-contained true

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish single-file EXE (x64 and ARM64)
        shell: pwsh
        run: |
          foreach ($rid in 'win-x64', 'win-arm64') {
            dotnet publish src/Filetranslate.csproj -c Release -r $rid --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true -o "publish/$rid"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path publish/win-x64/Beeslater.exe -DestinationPath Beeslater.zip
          Compress-Archive -Path publish/win-arm64/Beeslater.exe -DestinationPath Beeslater-arm64.zip

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" Beeslater.zip Beeslater-arm64.zip --title "${{ github.ref_name }}" --generate-notes
